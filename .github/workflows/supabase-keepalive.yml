# ╔════════════════════════════════════════════════════════════════╗
# ║ Supabase 自動停止ふせぎ（keep-alive）                            ║
# ║                                                                ║
# ║ 無料プランの Supabase は「7日間アクセスなし」で自動停止します。  ║
# ║ 停止すると 日程調整 / 予約フォーム / 抽選 / 改善リクエスト が    ║
# ║ 使えなくなるため、毎日1回だけ軽い読み取りを送って起こします。    ║
# ║                                                                ║
# ║ 接続先は piyo-config.js から読み取ります。URL やキーを変更しても ║
# ║ このファイルを直す必要はありません。                             ║
# ║                                                                ║
# ║ 手動で試したいとき：GitHub の Actions タブ →                    ║
# ║ 「Supabase keep-alive」→ Run workflow                          ║
# ╚════════════════════════════════════════════════════════════════╝
name: Supabase keep-alive

on:
  schedule:
    # 毎日 00:17 UTC（日本時間 09:17）に実行
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  # 毎月1日のタイムスタンプ更新（下の最終ステップ）に必要
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Supabase に軽いアクセスを送る
        run: |
          set -euo pipefail

          # piyo-config.js は window.PIYO_CONFIG に代入する形なので、
          # window を用意してから読み込んで値を取り出す
          URL=$(node -e "global.window={};require('./piyo-config.js');process.stdout.write(window.PIYO_CONFIG.SUPABASE_URL)")
          KEY=$(node -e "global.window={};require('./piyo-config.js');process.stdout.write(window.PIYO_CONFIG.SUPABASE_ANON_KEY)")

          echo "接続先: $URL"

          STATUS=$(curl -sS -o /tmp/res.json -w '%{http_code}' \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/events?select=id&limit=1")

          echo "HTTP ステータス: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "::error::Supabase へのアクセスに失敗しました。すでに停止しているか、キーが変わった可能性があります。"
            cat /tmp/res.json
            exit 1
          fi

          echo "OK: Supabase は起きています"

      - name: 毎月1日だけタイムスタンプを更新（GitHub の定期実行が自動停止するのを防ぐ）
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail

          # GitHub は「60日間コミットのないリポジトリ」の定期実行を自動で止める。
          # 月1回だけ小さなファイルを更新して、その 60日カウントをリセットする。
          if [ "$(date -u +%d)" != "01" ]; then
            echo "本日は1日ではないのでスキップします"
            exit 0
          fi

          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/keepalive-stamp
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/keepalive-stamp
          git commit -m '定期実行の維持: keep-alive タイムスタンプ更新'
          git push
