<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRコード作成 — ぴよツールズ</title>
  <link rel="icon" href="piyo-favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="piyo-theme.css">
  <script src="piyo-theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:            #F5F5F4;
      --surface:       #FFFFFF;
      --border:        #E7E5E4;
      --border-strong: #D6D3D1;
      --text-1:        #1C1917;
      --text-2:        #44403C;
      --text-3:        #78716C;
      --text-4:        #A8A29E;
      --icon-bg:       #F3F4F6;
      --primary:       #43A86A;
      --primary-dk:    #2D8D57;
      --primary-lt:    #C5E5D1;
      --primary-bg:    #EEF7F1;
      --radius-card:   14px;
      --radius:        8px;
      --shadow-sm:     0 1px 2px rgba(15,23,42,0.04);
      --shadow-md:     0 4px 12px rgba(15,23,42,0.06), 0 1px 3px rgba(15,23,42,0.04);
      --ring:          0 0 0 3px rgba(61,167,107,0.20);
      --transition:    150ms ease-out;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text-1);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ─ Topbar ─────────────────────────── */
    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .topbar-inner { max-width: 1200px; width: 100%; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; }
    .brand-logo { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .brand-logo svg { width: 60px; height: 60px; }
    .brand-text { display: flex; flex-direction: column; line-height: 1.15; gap: 4px; }
    .brand-name { font-size: 26px; font-weight: 800; color: var(--text-1); letter-spacing: -0.02em; }
    .brand-sub { font-size: 13px; color: var(--text-3); font-weight: 400; }
    .topbar-sep { color: var(--text-4); font-size: 18px; user-select: none; margin-left: 6px; }
    .topbar-current { font-size: 15px; font-weight: 600; color: var(--text-2); }
    .topbar-spacer { flex: 1; }
    .icon-btn { width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text-3); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color var(--transition), border-color var(--transition); }
    .icon-btn svg { width: 16px; height: 16px; }
    .icon-btn:hover { color: var(--text-1); border-color: var(--border-strong); }
    .icon-btn:focus-visible { outline: none; box-shadow: var(--ring); border-color: var(--primary); }

    /* ─ Page header ───────────────────── */
    .page-header { max-width: 1200px; margin: 0 auto; padding: 32px 24px 16px; }
    .page-header h1 { font-size: 28px; font-weight: 700; color: var(--text-1); letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 6px; }
    .page-header p { font-size: 14px; color: var(--text-3); }

    /* ─ Main / Layout ─────────────────── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 8px 24px 80px;
    }
    .layout-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .layout-grid { grid-template-columns: 1fr; }
    }

    /* ─ Block ─────────────────────────── */
    .block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      margin-bottom: 16px;
      overflow: hidden;
    }
    .block-header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .block-header-icon { width: 18px; height: 18px; color: var(--text-3); display: inline-flex; align-items: center; justify-content: center; }
    .block-header-icon svg { width: 100%; height: 100%; }
    .block-header-title { font-size: 14px; font-weight: 600; color: var(--text-1); }
    .block-body { padding: 18px 20px; }

    /* ─ Text input ────────────────────── */
    .text-area {
      width: 100%;
      min-height: 120px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.65;
      font-family: inherit;
      color: var(--text-1);
      background: #FAFAF9;
      resize: vertical;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }
    .text-area:focus-visible {
      outline: none;
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: var(--ring);
    }
    .text-area::placeholder { color: var(--text-4); }
    .field-hint { font-size: 12px; color: var(--text-4); margin-top: 8px; }

    /* ─ Options ───────────────────────── */
    .opt-section { margin-bottom: 18px; }
    .opt-section:last-child { margin-bottom: 0; }
    .opt-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }
    .seg-group {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .seg-btn {
      padding: 8px 14px;
      min-height: 36px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text-2);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all var(--transition);
    }
    .seg-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-bg); }
    .seg-btn.active {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
    }
    .seg-btn:focus-visible { outline: none; box-shadow: var(--ring); }
    .seg-btn small {
      display: block;
      font-size: 10px;
      color: inherit;
      opacity: 0.7;
      margin-top: 2px;
    }

    /* ─ Preview ───────────────────────── */
    .preview-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .preview-canvas-wrap {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      background: #FAFAF9;
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
    }
    .preview-canvas-wrap canvas {
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
    }
    .preview-empty {
      color: var(--text-4);
      font-size: 13px;
      text-align: center;
    }
    .preview-empty svg { width: 36px; height: 36px; margin-bottom: 8px; opacity: 0.4; }
    .preview-info {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-4);
      padding: 0 4px;
    }

    /* ─ Download buttons ──────────────── */
    .download-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
    }
    .dl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 16px;
      min-height: 44px;
      border: 1px solid var(--primary);
      border-radius: var(--radius);
      background: var(--primary);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all var(--transition);
      text-decoration: none;
    }
    .dl-btn svg { width: 16px; height: 16px; }
    .dl-btn:hover:not(:disabled) { background: var(--primary-dk); border-color: var(--primary-dk); }
    .dl-btn:focus-visible { outline: none; box-shadow: var(--ring); }
    .dl-btn.secondary {
      background: var(--surface);
      color: var(--primary);
    }
    .dl-btn.secondary:hover:not(:disabled) {
      background: var(--primary-bg);
      color: var(--primary-dk);
      border-color: var(--primary-dk);
    }
    .dl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .copy-btn-wide {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 14px;
      min-height: 38px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text-2);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all var(--transition);
    }
    .copy-btn-wide:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: var(--primary-bg); }
    .copy-btn-wide:focus-visible { outline: none; box-shadow: var(--ring); }
    .copy-btn-wide:disabled { opacity: 0.4; cursor: not-allowed; }
    .copy-btn-wide svg { width: 14px; height: 14px; }

    .error-msg {
      width: 100%;
      padding: 10px 14px;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: var(--radius);
      color: #991B1B;
      font-size: 12px;
      display: none;
    }
    .error-msg.show { display: block; }

    /* ─ Footer ────────────────────────── */
    footer { max-width: 1200px; margin: 0 auto; padding: 24px; color: var(--text-4); font-size: 12px; text-align: center; }

    @media (max-width: 720px) {
      .topbar-inner { padding: 10px 16px; gap: 8px; }
      .brand-sub { display: none; }
      .page-header { padding: 24px 20px 8px; }
      .page-header h1 { font-size: 22px; }
      main { padding: 8px 16px 60px; }
    }
  </style>
</head>
<body>

<!-- Topbar -->
<header class="topbar" role="banner">
  <div class="topbar-inner">
    <a href="index.html" class="brand" aria-label="ぴよツールズ ホーム">

          <path d="M24 9 C29 5 30 1 27 1 C25.5 1 25 4 24 9 Z" fill="#FCD34D" stroke="#3D2F1F" stroke-width="1.1" stroke-linejoin="round"/>
          <circle cx="24" cy="28" r="19" fill="#FCD34D" stroke="#3D2F1F" stroke-width="1.2"/>

<!-- Page Header -->
<div class="page-header">
  <h1>QRコード作成</h1>
  <p>URLやテキストをQRコードに変換、PNG / SVG でダウンロード</p>
</div>

<main>
<div class="layout-grid">

<!-- 左：入力 + オプション -->
<div>

  <div class="block">
    <div class="block-header">
      <span class="block-header-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      </span>
      <span class="block-header-title">テキスト / URL</span>
    </div>
    <div class="block-body">
      <textarea id="qr-input" class="text-area" placeholder="QRコード化したいテキストやURLを入力&#10;&#10;例：&#10;https://nagachanx.github.io/piyo-tools/&#10;朝会MTG: 9:30〜"></textarea>
      <p class="field-hint">入力するとリアルタイムで生成されます。最大約2,953文字（誤り訂正レベル L 時）</p>
    </div>
  </div>

  <div class="block">
    <div class="block-header">
      <span class="block-header-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </span>
      <span class="block-header-title">設定</span>
    </div>
    <div class="block-body">

      <div class="opt-section">
        <div class="opt-label">サイズ</div>
        <div class="seg-group" role="radiogroup" aria-label="サイズ" id="size-group">
          <button class="seg-btn" data-size="256" role="radio" aria-checked="false">256px</button>
          <button class="seg-btn active" data-size="512" role="radio" aria-checked="true">512px</button>
          <button class="seg-btn" data-size="1024" role="radio" aria-checked="false">1024px</button>
        </div>
      </div>

      <div class="opt-section">
        <div class="opt-label">誤り訂正レベル</div>
        <div class="seg-group" role="radiogroup" aria-label="誤り訂正レベル" id="ec-group">
          <button class="seg-btn" data-ec="L" role="radio" aria-checked="false">L<small>約7%</small></button>
          <button class="seg-btn active" data-ec="M" role="radio" aria-checked="true">M<small>約15%</small></button>
          <button class="seg-btn" data-ec="Q" role="radio" aria-checked="false">Q<small>約25%</small></button>

</div>

<!-- 右：プレビュー + ダウンロード -->
<div class="preview-wrap">
  <div class="preview-canvas-wrap" id="canvas-wrap">
    <canvas id="qr-canvas"></canvas>
    <div class="preview-empty" id="preview-empty" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
      <div>テキストを入力するとQRコードが表示されます</div>
    </div>
  </div>

  <div class="preview-info">
    <span id="info-size">512 × 512 px</span>
    <span id="info-ec">レベル M</span>
  </div>

  <div class="error-msg" id="error-msg"></div>

  <div class="download-group">
    <button class="dl-btn" id="dl-png" onclick="downloadPNG()" disabled aria-label="PNGダウンロード">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      PNG
    </button>
    <button class="dl-btn secondary" id="dl-svg" onclick="downloadSVG()" disabled aria-label="SVGダウンロード">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      SVG
    </button>
  </div>

  <button class="copy-btn-wide" id="copy-btn" onclick="copyImage()" disabled aria-label="画像をクリップボードにコピー">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    <span id="copy-label">画像をクリップボードにコピー</span>
  </button>

</div>

</div>
</main>

<footer>ぴよツールズ — 社内専用</footer>

<!-- node-qrcode (ローカル同梱、CDN依存なし) -->
<script src="qrcode.min.js"></script>
<script>
const inputEl   = document.getElementById('qr-input');
const canvasEl  = document.getElementById('qr-canvas');
const wrapEl    = document.getElementById('canvas-wrap');
const emptyEl   = document.getElementById('preview-empty');
const errorEl   = document.getElementById('error-msg');
const infoSize  = document.getElementById('info-size');
const infoEc    = document.getElementById('info-ec');
const dlPng     = document.getElementById('dl-png');
const dlSvg     = document.getElementById('dl-svg');
const copyBtn   = document.getElementById('copy-btn');
const copyLabel = document.getElementById('copy-label');

let currentSize = 512;
let currentEc   = 'M';

// セグメントボタンの切替
function setupSegGroup(groupId, onChange) {
  const group = document.getElementById(groupId);
  group.addEventListener('click', e => {
    const btn = e.target.closest('.seg-btn');
    if (!btn) return;
    group.querySelectorAll('.seg-btn').forEach(b => {
      const active = b === btn;
      b.classList.toggle('active', active);
      b.setAttribute('aria-checked', active);
    });
    onChange(btn);
  });
}

setupSegGroup('size-group', btn => {
  currentSize = parseInt(btn.dataset.size, 10);
  render();
});
setupSegGroup('ec-group', btn => {
  currentEc = btn.dataset.ec;
  render();
});

// QR生成（デバウンス付き）
let renderTimer = null;
function scheduleRender() {
  if (renderTimer) clearTimeout(renderTimer);
  renderTimer = setTimeout(render, 150);
}

function showError(msg) {
  if (msg) {
    errorEl.textContent = msg;
    errorEl.classList.add('show');
  } else {
    errorEl.classList.remove('show');
  }
}

function render() {
  const text = inputEl.value;

  // 表示情報を更新
  infoSize.textContent = `${currentSize} × ${currentSize} px`;
  infoEc.textContent   = `レベル ${currentEc}`;

  if (text.trim() === '') {
    canvasEl.style.display = 'none';
    emptyEl.style.display = 'block';
    dlPng.disabled = dlSvg.disabled = copyBtn.disabled = true;
    showError('');
    return;
  }

  QRCode.toCanvas(canvasEl, text, {
    width: currentSize,
    errorCorrectionLevel: currentEc,
    margin: 2,
    color: { dark: '#000000', light: '#FFFFFF' }
  }, (err) => {
    if (err) {
      console.error(err);
      canvasEl.style.display = 'none';
      emptyEl.style.display = 'block';
      dlPng.disabled = dlSvg.disabled = copyBtn.disabled = true;
      showError(err.message?.includes('too big') || err.message?.includes('large')
        ? 'テキストが長すぎます。誤り訂正レベルを下げるか、テキストを短くしてください。'
        : 'QRコードの生成に失敗しました：' + (err.message || err));
      return;
    }
    canvasEl.style.display = 'block';
    emptyEl.style.display = 'none';
    dlPng.disabled = dlSvg.disabled = copyBtn.disabled = false;
    showError('');
  });
}

// 入力中に自動生成（デバウンス）
inputEl.addEventListener('input', scheduleRender);

// ダウンロード関数
function triggerDownload(url, filename) {
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function timestamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

function downloadPNG() {
  if (!canvasEl) return;
  canvasEl.toBlob(blob => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    triggerDownload(url, `qrcode-${timestamp()}.png`);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, 'image/png');
}

function downloadSVG() {
  const text = inputEl.value;
  if (text.trim() === '') return;
  QRCode.toString(text, {
    type: 'svg',
    width: currentSize,
    errorCorrectionLevel: currentEc,
    margin: 2,
    color: { dark: '#000000', light: '#FFFFFF' }
  }, (err, svg) => {
    if (err) { alert('SVG生成に失敗しました'); return; }
    const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    triggerDownload(url, `qrcode-${timestamp()}.svg`);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
}

async function copyImage() {
  if (!canvasEl) return;
  try {
    const blob = await new Promise(r => canvasEl.toBlob(r, 'image/png'));
    if (!blob) throw new Error('blob生成失敗');
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    copyLabel.textContent = '✓ コピーしました';
    setTimeout(() => { copyLabel.textContent = '画像をクリップボードにコピー'; }, 1500);
  } catch (e) {
    console.error(e);
    alert('クリップボードへのコピーに失敗しました。');
  }
}

// 初期化（CDN読み込み完了を確認）
function init() {
  if (typeof QRCode === 'undefined') {
    setTimeout(init, 50);
    return;
  }
  render();
}
init();
</script>
