<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>単位・通貨変換 — ぴよツールズ</title>
  <link rel="icon" href="piyo-favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="piyo-theme.css">
  <script src="piyo-theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#F5F5F4; --surface:#FFFFFF; --border:#E7E5E4; --border-strong:#D6D3D1;
      --text-1:#1C1917; --text-2:#44403C; --text-3:#78716C; --text-4:#A8A29E;
      --icon-bg:#F3F4F6;
      --primary:#43A86A; --primary-dk:#2D8D57; --primary-lt:#C5E5D1; --primary-bg:#EEF7F1;
      --radius-card:14px; --radius:8px;
      --shadow-sm:0 1px 2px rgba(15,23,42,0.04);
      --ring:0 0 0 3px rgba(61,167,107,0.20);
      --transition:150ms ease-out;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter','Noto Sans JP',-apple-system,sans-serif; background: var(--bg); min-height: 100vh; color: var(--text-1); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }

    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .topbar-inner { max-width: 1100px; width: 100%; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; }
    .brand-logo { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .brand-logo svg { width: 60px; height: 60px; }
    .brand-text { display: flex; flex-direction: column; line-height: 1.15; gap: 4px; }
    .brand-name { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
    .brand-sub { font-size: 13px; color: var(--text-3); }
    .topbar-sep { color: var(--text-4); margin-left: 6px; }
    .topbar-current { font-size: 15px; font-weight: 600; color: var(--text-2); }

    .page-header { max-width: 1100px; margin: 0 auto; padding: 32px 24px 8px; }
    .page-header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 6px; }
    .page-header p { font-size: 14px; color: var(--text-3); }

    main { max-width: 1100px; margin: 0 auto; padding: 16px 24px 80px; }

    /* タブ */
    .cat-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .cat-tab {
      padding: 8px 16px; min-height: 36px;
      border: 1px solid var(--border); background: var(--surface);
      border-radius: 999px;
      font-size: 13px; font-weight: 500; color: var(--text-2);
      cursor: pointer; font-family: inherit;
      display: inline-flex; align-items: center; gap: 6px;
      transition: all var(--transition);
    }
    .cat-tab:hover { border-color: var(--primary); color: var(--primary); }
    .cat-tab.active { background: var(--primary); border-color: var(--primary); color: white; }
    .cat-tab svg { width: 14px; height: 14px; }

    /* 変換パネル */
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 24px; }
    .convert-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: stretch; }
    .convert-side { display: flex; flex-direction: column; gap: 8px; }
    .convert-label { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; }
    .convert-input {
      width: 100%; padding: 14px 16px;
      font-size: 22px; font-weight: 600;
      font-family: 'SF Mono','Menlo',monospace;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text-1);
      text-align: right;
    }
    .convert-input:focus-visible {
      outline: none; border-color: var(--primary); box-shadow: var(--ring);
    }
    .convert-input[readonly] { background: var(--icon-bg); color: var(--text-2); }
    .convert-unit {
      width: 100%; padding: 10px 12px;
      font-size: 14px; font-family: inherit; color: var(--text-1);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--surface);
      cursor: pointer;
    }
    .convert-swap {
      align-self: center;
      width: 40px; height: 40px;
      border: 1px solid var(--border-strong);
      border-radius: 50%;
      background: var(--surface);
      cursor: pointer;
      color: var(--text-3);
      display: flex; align-items: center; justify-content: center;
      transition: all var(--transition);
      margin-top: 22px;
    }
    .convert-swap:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-bg); transform: rotate(180deg); }
    .convert-swap svg { width: 18px; height: 18px; }

    @media (max-width: 720px) {
      .convert-grid { grid-template-columns: 1fr; }
      .convert-swap { margin: 0 auto; transform: rotate(90deg); }
      .convert-swap:hover { transform: rotate(270deg); }
    }

    /* 早見表 */
    .quick-ref { margin-top: 18px; padding: 14px 16px; background: var(--icon-bg); border-radius: var(--radius); }
    .quick-ref-title { font-size: 12px; font-weight: 600; color: var(--text-3); margin-bottom: 8px; }
    .quick-ref-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px 14px; font-size: 13px; color: var(--text-2); }
    .quick-ref-grid b { font-weight: 600; color: var(--text-1); }

    /* 通貨専用メタ */
    .currency-meta {
      margin-top: 14px; padding: 10px 14px;
      background: var(--primary-bg); border: 1px solid var(--primary-lt);
      border-radius: var(--radius);
      font-size: 12px; color: var(--primary-dk);
      display: flex; align-items: center; gap: 8px;
    }
    .currency-meta svg { width: 14px; height: 14px; flex-shrink: 0; }
    .currency-meta.err { background: #FEF2F2; border-color: #FECACA; color: #991B1B; }

    footer { max-width: 1100px; margin: 0 auto; padding: 24px; color: var(--text-4); font-size: 12px; text-align: center; }

    @media (max-width: 720px) {
      .topbar-inner { padding: 10px 16px; }
      .page-header { padding: 20px 16px 8px; }
      main { padding: 12px 16px 60px; }
      .panel { padding: 18px; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand" aria-label="ぴよツールズ ホーム">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 9 C19 5 18 1 21 1 C22.5 1 23 4 24 9 Z" fill="#FCD34D" stroke="#3D2F1F" stroke-width="1.1" stroke-linejoin="round"/>
          <path d="M24 9 C29 5 30 1 27 1 C25.5 1 25 4 24 9 Z" fill="#FCD34D" stroke="#3D2F1F" stroke-width="1.1" stroke-linejoin="round"/>
          <circle cx="24" cy="28" r="19" fill="#FCD34D" stroke="#3D2F1F" stroke-width="1.2"/>
          <clipPath id="piyoBody"><circle cx="24" cy="28" r="18"/></clipPath>
          <rect x="0" y="15" width="48" height="22" fill="#F5EFE0" clip-path="url(#piyoBody)"/>
          <path d="M20 19.5 Q19 19.8 18 20.5" stroke="#3D2F1F" stroke-width="1.0" fill="none" stroke-linecap="round"/>
          <path d="M28 19.5 Q29 19.8 30 20.5" stroke="#3D2F1F" stroke-width="1.0" fill="none" stroke-linecap="round"/>
          <circle cx="15.5" cy="28" r="1.5" fill="#3D2F1F"/>
          <circle cx="32.5" cy="28" r="1.5" fill="#3D2F1F"/>
          <path d="M24 25 Q18 28 19.5 32 Q24 34.2 28.5 32 Q30 28 24 25 Z" fill="#FCD34D"/>
          <path d="M19.5 32 Q24 34.2 28.5 32" stroke="#3D2F1F" stroke-width="1.0" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">ぴよツールズ</span>
        <span class="brand-sub">サクッと使えるWebツール</span>
      </div>
    </a>
    <span class="topbar-sep">/</span>
    <span class="topbar-current">単位・通貨変換</span>
    <button type="button" class="theme-toggle" aria-label="テーマ切替"></button>
  </div>
</header>

<div class="page-header">
  <h1>単位・通貨変換</h1>
  <p>長さ・重さ・体積・温度・時間・通貨を一発変換</p>
</div>

<main>
  <div class="cat-tabs" id="cat-tabs"><!-- JS生成 --></div>

  <div class="panel">
    <div class="convert-grid">
      <div class="convert-side">
        <label class="convert-label">変換元</label>
        <input type="number" id="from-value" class="convert-input" value="1" step="any" inputmode="decimal">
        <select id="from-unit" class="convert-unit"></select>
      </div>
      <button class="convert-swap" type="button" id="swap-btn" aria-label="入れ替え" title="単位を入れ替え">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
      <div class="convert-side">
        <label class="convert-label">変換結果</label>
        <input type="text" id="to-value" class="convert-input" readonly>
        <select id="to-unit" class="convert-unit"></select>
      </div>
    </div>

    <div id="currency-meta" class="currency-meta" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span id="currency-meta-text">レート読み込み中…</span>
    </div>

    <div class="quick-ref">
      <div class="quick-ref-title">早見表（1 <span id="qr-from-unit"></span> = ?）</div>
      <div class="quick-ref-grid" id="quick-ref-grid"></div>
    </div>
  </div>
</main>

<footer>ぴよツールズ — 社内専用</footer>

<script>
// ═══ カテゴリ定義 ═══════════════════════════════
// 各単位は「基準単位への係数」で持つ（線形変換のみ）
// 温度のみ別途関数で対応
const CATS = {
  length: {
    label: '長さ', icon: '📏', baseUnit: 'm',
    units: {
      mm:    { name: 'ミリメートル (mm)', factor: 0.001 },
      cm:    { name: 'センチメートル (cm)', factor: 0.01 },
      m:     { name: 'メートル (m)', factor: 1 },
      km:    { name: 'キロメートル (km)', factor: 1000 },
      inch:  { name: 'インチ (in)', factor: 0.0254 },
      ft:    { name: 'フィート (ft)', factor: 0.3048 },
      yd:    { name: 'ヤード (yd)', factor: 0.9144 },
      mile:  { name: 'マイル (mile)', factor: 1609.344 },
      尺:    { name: '尺', factor: 0.30303 },
      間:    { name: '間', factor: 1.81818 },
      里:    { name: '里', factor: 3927.27 }
    }
  },
  weight: {
    label: '重さ', icon: '⚖️', baseUnit: 'g',
    units: {
      mg:   { name: 'ミリグラム (mg)', factor: 0.001 },
      g:    { name: 'グラム (g)', factor: 1 },
      kg:   { name: 'キログラム (kg)', factor: 1000 },
      t:    { name: 'トン (t)', factor: 1000000 },
      oz:   { name: 'オンス (oz)', factor: 28.3495 },
      lb:   { name: 'ポンド (lb)', factor: 453.592 },
      匁:   { name: '匁 (もんめ)', factor: 3.75 },
      斤:   { name: '斤', factor: 600 },
      貫:   { name: '貫', factor: 3750 }
    }
  },
  volume: {
    label: '体積', icon: '🥛', baseUnit: 'L',
    units: {
      ml:    { name: 'ミリリットル (ml)', factor: 0.001 },
      L:     { name: 'リットル (L)', factor: 1 },
      m3:    { name: '立方メートル (m³)', factor: 1000 },
      cm3:   { name: '立方センチメートル (cm³)', factor: 0.001 },
      cup:   { name: 'カップ (200ml)', factor: 0.2 },
      tbsp:  { name: '大さじ (15ml)', factor: 0.015 },
      tsp:   { name: '小さじ (5ml)', factor: 0.005 },
      gal:   { name: 'ガロン (米, gal)', factor: 3.78541 },
      floz:  { name: '液量オンス (米, fl oz)', factor: 0.0295735 },
      升:    { name: '升 (しょう)', factor: 1.8039 },
      合:    { name: '合 (ごう)', factor: 0.18039 }
    }
  },
  temperature: {
    label: '温度', icon: '🌡️', baseUnit: 'C',
    units: {
      C:  { name: 'セ氏 (℃)' },
      F:  { name: '華氏 (℉)' },
      K:  { name: 'ケルビン (K)' }
    },
    // 温度は線形係数ではないので変換関数で
    convert(value, from, to) {
      // まず℃に正規化
      let c;
      if (from === 'C') c = value;
      else if (from === 'F') c = (value - 32) * 5 / 9;
      else if (from === 'K') c = value - 273.15;
      // ℃から目的単位へ
      if (to === 'C') return c;
      if (to === 'F') return c * 9 / 5 + 32;
      if (to === 'K') return c + 273.15;
    }
  },
  time: {
    label: '時間', icon: '⏱️', baseUnit: 's',
    units: {
      ms:    { name: 'ミリ秒 (ms)', factor: 0.001 },
      s:     { name: '秒 (s)', factor: 1 },
      min:   { name: '分 (min)', factor: 60 },
      h:     { name: '時間 (h)', factor: 3600 },
      day:   { name: '日 (day)', factor: 86400 },
      week:  { name: '週 (week)', factor: 604800 },
      month: { name: '月 (約30.44日)', factor: 2629746 },
      year:  { name: '年 (約365.25日)', factor: 31556952 }
    }
  },
  currency: {
    label: '通貨', icon: '💴', baseUnit: 'JPY',
    units: {} // APIで動的に取得
  }
};

const PRIMARY_UNITS = {
  length: ['cm','m','km','inch','ft','mile','尺'],
  weight: ['g','kg','t','lb','oz'],
  volume: ['ml','L','cup','tbsp','tsp'],
  temperature: ['C','F','K'],
  time: ['s','min','h','day','week'],
  currency: ['USD','EUR','GBP','CNY','KRW','PHP','BRL','AUD','THB','VND']
};

let currentCat = 'length';
let currencyRates = null; // JPY基準 { USD: 0.0064, EUR: 0.006, ... }
let currencyDate = null;

// ─── タブ生成 ───
function buildTabs() {
  const tabs = document.getElementById('cat-tabs');
  tabs.innerHTML = Object.entries(CATS).map(([key, cat]) => `
    <button class="cat-tab ${key === currentCat ? 'active' : ''}" data-cat="${key}">
      <span>${cat.icon}</span><span>${cat.label}</span>
    </button>
  `).join('');
  tabs.querySelectorAll('.cat-tab').forEach(btn => {
    btn.onclick = () => { currentCat = btn.dataset.cat; buildTabs(); rebuildUnits(); };
  });
}

// ─── 単位プルダウン更新 ───
async function rebuildUnits() {
  const cat = CATS[currentCat];
  const meta = document.getElementById('currency-meta');

  if (currentCat === 'currency') {
    meta.style.display = 'flex';
    if (!currencyRates) await fetchCurrencyRates();
    // 取得失敗時は早期return
    if (!currencyRates) return;
  } else {
    meta.style.display = 'none';
  }

  const fromSel = document.getElementById('from-unit');
  const toSel   = document.getElementById('to-unit');
  const unitEntries = Object.entries(cat.units);

  function renderOptions(sel) {
    sel.innerHTML = unitEntries.map(([code, u]) =>
      `<option value="${code}">${u.name}</option>`
    ).join('');
  }
  renderOptions(fromSel);
  renderOptions(toSel);

  // デフォルトの組み合わせ
  const defaults = {
    length: ['m', 'cm'],
    weight: ['kg', 'g'],
    volume: ['L', 'ml'],
    temperature: ['C', 'F'],
    time: ['h', 'min'],
    currency: ['JPY', 'USD']
  };
  fromSel.value = defaults[currentCat][0];
  toSel.value   = defaults[currentCat][1];

  doConvert();
  buildQuickRef();
}

// ─── 変換ロジック ───
function convertValue(value, from, to) {
  if (currentCat === 'temperature') return CATS.temperature.convert(value, from, to);
  if (currentCat === 'currency') {
    if (!currencyRates) return NaN;
    // JPY基準のレート: { USD: 0.0064 } を使い、from→JPY→toで変換
    const toJPY = from === 'JPY' ? 1 : (1 / currencyRates[from]);
    const fromJPY = to === 'JPY' ? 1 : currencyRates[to];
    return value * toJPY * fromJPY;
  }
  // 通常の線形変換
  const factorFrom = CATS[currentCat].units[from].factor;
  const factorTo   = CATS[currentCat].units[to].factor;
  return value * factorFrom / factorTo;
}

function formatNumber(n) {
  if (!isFinite(n)) return '';
  const abs = Math.abs(n);
  let str;
  if (abs === 0) str = '0';
  else if (abs >= 1e9 || abs < 1e-4) str = n.toExponential(6);
  else if (abs >= 100) str = n.toFixed(2);
  else if (abs >= 1) str = n.toFixed(4);
  else str = n.toFixed(6);
  // 末尾の不要な0を削除（小数点も）
  return str.replace(/\.?0+$/, '');
}

function doConvert() {
  const v = parseFloat(document.getElementById('from-value').value);
  if (isNaN(v)) { document.getElementById('to-value').value = ''; return; }
  const from = document.getElementById('from-unit').value;
  const to   = document.getElementById('to-unit').value;
  const result = convertValue(v, from, to);
  document.getElementById('to-value').value = formatNumber(result);
  buildQuickRef();
}

// ─── 早見表（1 from = ? の対応表）───
function buildQuickRef() {
  const cat = CATS[currentCat];
  const from = document.getElementById('from-unit').value;
  const qrUnit = document.getElementById('qr-from-unit');
  qrUnit.textContent = cat.units[from] ? cat.units[from].name.replace(/\s*\(.+\)$/, '') : from;
  const grid = document.getElementById('quick-ref-grid');
  const primary = PRIMARY_UNITS[currentCat] || Object.keys(cat.units);
  grid.innerHTML = primary
    .filter(u => u !== from && cat.units[u])
    .map(u => {
      const val = convertValue(1, from, u);
      const unitLabel = cat.units[u].name.replace(/\s*\(.+\)$/, '');
      const code = u.length <= 5 ? ` ${u}` : '';
      return `<div>= <b>${formatNumber(val)}</b>${code} <span style="color:var(--text-4)">(${unitLabel})</span></div>`;
    }).join('');
}

// ─── 通貨レート取得（frankfurter.app、APIキー不要）───
async function fetchCurrencyRates() {
  const meta = document.getElementById('currency-meta');
  const metaText = document.getElementById('currency-meta-text');
  meta.classList.remove('err');
  metaText.textContent = 'レート読み込み中…';

  // 1時間キャッシュ
  const cacheKey = 'piyo-currency-rates';
  try {
    const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
    if (cached && (Date.now() - cached.t) < 60 * 60 * 1000) {
      currencyRates = cached.rates;
      currencyDate = cached.date;
      CATS.currency.units = buildCurrencyUnits(cached.rates);
      metaText.textContent = `更新日: ${cached.date}（キャッシュ）・ECB公表レート`;
      return;
    }
  } catch {}

  try {
    // 通貨コードを羅列して、JPY基準のレートを取得
    const allCurrencies = ['USD','EUR','GBP','CNY','KRW','PHP','BRL','AUD','THB','VND','TWD','HKD','SGD','INR','IDR','MYR','CAD','CHF','NZD','MXN','RUB','ZAR','SEK','NOK','DKK','PLN','TRY','AED','SAR'];
    const url = `https://api.frankfurter.app/latest?from=JPY&to=${allCurrencies.join(',')}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('rate fetch failed');
    const data = await res.json();
    currencyRates = data.rates;  // { USD: 0.0064, EUR: 0.006, ... }
    currencyDate = data.date;
    CATS.currency.units = buildCurrencyUnits(data.rates);
    localStorage.setItem(cacheKey, JSON.stringify({ t: Date.now(), rates: data.rates, date: data.date }));
    metaText.textContent = `更新日: ${data.date} ・ECB公表レート`;
  } catch (e) {
    console.error(e);
    meta.classList.add('err');
    metaText.textContent = 'レートの取得に失敗しました。ネットワークを確認してください。';
    currencyRates = null;
  }
}

function buildCurrencyUnits(rates) {
  const NAMES = {
    JPY:'日本円 (JPY)', USD:'米ドル (USD)', EUR:'ユーロ (EUR)', GBP:'英ポンド (GBP)',
    CNY:'人民元 (CNY)', KRW:'韓国ウォン (KRW)', PHP:'フィリピンペソ (PHP)', BRL:'ブラジルレアル (BRL)',
    AUD:'豪ドル (AUD)', THB:'タイバーツ (THB)', VND:'ベトナムドン (VND)', TWD:'台湾ドル (TWD)',
    HKD:'香港ドル (HKD)', SGD:'シンガポールドル (SGD)', INR:'インドルピー (INR)',
    IDR:'インドネシアルピア (IDR)', MYR:'マレーシアリンギット (MYR)',
    CAD:'カナダドル (CAD)', CHF:'スイスフラン (CHF)', NZD:'NZドル (NZD)',
    MXN:'メキシコペソ (MXN)', RUB:'ロシアルーブル (RUB)', ZAR:'南アランド (ZAR)',
    SEK:'スウェーデンクローナ (SEK)', NOK:'ノルウェークローネ (NOK)', DKK:'デンマーククローネ (DKK)',
    PLN:'ポーランドズロチ (PLN)', TRY:'トルコリラ (TRY)', AED:'UAEディルハム (AED)',
    SAR:'サウジリヤル (SAR)'
  };
  const units = { JPY: { name: NAMES.JPY } };
  Object.keys(rates).forEach(code => {
    units[code] = { name: NAMES[code] || code };
  });
  return units;
}

// ─── イベント ───
document.getElementById('from-value').addEventListener('input', doConvert);
document.getElementById('from-unit').addEventListener('change', () => { doConvert(); buildQuickRef(); });
document.getElementById('to-unit').addEventListener('change', doConvert);
document.getElementById('swap-btn').addEventListener('click', () => {
  const fu = document.getElementById('from-unit'),
        tu = document.getElementById('to-unit');
  [fu.value, tu.value] = [tu.value, fu.value];
  doConvert();
});

// ─── 初期化 ───
buildTabs();
rebuildUnits();
</script>
