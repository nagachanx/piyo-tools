<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テキスト変換 — ぴよツールズ</title>
  <link rel="icon" href="piyo-favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="piyo-theme.css">
  <script src="piyo-theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#F5F5F4; --surface:#FFFFFF; --border:#E7E5E4; --border-strong:#D6D3D1;
      --text-1:#1C1917; --text-2:#44403C; --text-3:#78716C; --text-4:#A8A29E;
      --icon-bg:#F3F4F6; --primary:#43A86A; --primary-dk:#2D8D57; --primary-lt:#C5E5D1; --primary-bg:#EEF7F1;
      --radius-card:14px; --radius:8px;
      --shadow-sm:0 1px 2px rgba(15,23,42,0.04);
      --ring:0 0 0 3px rgba(61,167,107,0.20); --transition:150ms ease-out;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', 'Noto Sans JP', -apple-system, sans-serif; background: var(--bg); min-height: 100vh; color: var(--text-1); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }

    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .topbar-inner { max-width: 1200px; width: 100%; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; }
    .brand-logo { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .brand-logo svg { width: 60px; height: 60px; }
    .brand-text { display: flex; flex-direction: column; line-height: 1.15; gap: 4px; }
    .brand-name { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
    .brand-sub { font-size: 13px; color: var(--text-3); }
    .topbar-sep { color: var(--text-4); font-size: 18px; margin-left: 6px; }
    .topbar-current { font-size: 15px; font-weight: 600; color: var(--text-2); }
    .topbar-spacer { flex: 1; }
    .icon-btn { width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text-3); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all var(--transition); }
    .icon-btn svg { width: 16px; height: 16px; }
    .icon-btn:hover { color: var(--text-1); border-color: var(--border-strong); }
    .icon-btn:focus-visible { outline: none; box-shadow: var(--ring); border-color: var(--primary); }

    .page-header { max-width: 1200px; margin: 0 auto; padding: 32px 24px 16px; }
    .page-header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 6px; }
    .page-header p { font-size: 14px; color: var(--text-3); }

    main { max-width: 1100px; margin: 0 auto; padding: 8px 24px 80px; }

    .layout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 880px) { .layout-grid { grid-template-columns: 1fr; } }

    .block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); overflow: hidden; }
    .block-header { padding: 14px 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
    .block-header-icon { width: 18px; height: 18px; color: var(--text-3); }
    .block-header-icon svg { width: 100%; height: 100%; }
    .block-header-title { font-size: 14px; font-weight: 600; flex: 1; }
    .block-body { padding: 18px 20px; }

    .text-area { width: 100%; min-height: 280px; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; line-height: 1.7; font-family: 'SF Mono', 'Menlo', 'Consolas', monospace; color: var(--text-1); background: #FAFAF9; resize: vertical; transition: all var(--transition); }
    .text-area:focus-visible { outline: none; border-color: var(--primary); background: var(--surface); box-shadow: var(--ring); }
    .text-area::placeholder { color: var(--text-4); font-family: 'Inter', 'Noto Sans JP', sans-serif; }
    .text-area.output { background: #FAFAF9; }

    .header-btn { padding: 5px 10px; min-height: 28px; font-size: 12px; font-weight: 500; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); color: var(--text-3); cursor: pointer; font-family: inherit; transition: all var(--transition); display: inline-flex; align-items: center; gap: 4px; }
    .header-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-bg); }
    .header-btn svg { width: 12px; height: 12px; }

    /* Transform buttons */
    .transform-block { margin-top: 16px; }
    .transform-section { margin-bottom: 14px; }
    .transform-section:last-child { margin-bottom: 0; }
    .transform-label { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
    .transform-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .tx-btn { padding: 8px 12px; min-height: 36px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); color: var(--text-2); font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit; transition: all var(--transition); }
    .tx-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-bg); }
    .tx-btn:focus-visible { outline: none; box-shadow: var(--ring); }
    .tx-btn:active { transform: scale(0.96); }

    .swap-row { display: flex; justify-content: center; padding: 8px 0; }
    .swap-btn { width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 50%; background: var(--surface); color: var(--text-3); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all var(--transition); }
    .swap-btn:hover { color: var(--primary); border-color: var(--primary); transform: rotate(180deg); }
    .swap-btn svg { width: 16px; height: 16px; }

    .stats-row { padding: 10px 18px; background: #FAFAF9; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }

    footer { max-width: 1200px; margin: 0 auto; padding: 24px; color: var(--text-4); font-size: 12px; text-align: center; }
    @media (max-width: 720px) {
      .topbar-inner { padding: 10px 16px; gap: 8px; }
      .brand-sub { display: none; }
      .page-header { padding: 24px 20px 8px; }
      .page-header h1 { font-size: 22px; }
      main { padding: 8px 16px 60px; }
      .text-area { min-height: 200px; }
    }
  </style>
</head>
<body>

<header class="topbar" role="banner">
  <div class="topbar-inner">
    <a href="index.html" class="brand" aria-label="ぴよツールズ ホーム">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 9 C19 5 18 1 21 1 C22.5 1 23 4 24 9 Z" fill="#FCD34D" stroke="#3D2F1F" stroke-width="1.1" stroke-linejoin="round"/>
          <path d="M24 9 C29 5 30 1 27 1 C25.5 1 25 4 24 9 Z" fill="#FCD34D" stroke="#3D2F1F" stroke-width="1.1" stroke-linejoin="round"/>
          <circle cx="24" cy="28" r="19" fill="#FCD34D" stroke="#3D2F1F" stroke-width="1.2"/>
          <clipPath id="piyoBody"><circle cx="24" cy="28" r="18"/></clipPath>
          <rect x="0" y="15" width="48" height="22" fill="#F5EFE0" clip-path="url(#piyoBody)"/>
          <path d="M20 19.5 Q19 19.8 18 20.5" stroke="#3D2F1F" stroke-width="1.0" fill="none" stroke-linecap="round"/>
          <path d="M28 19.5 Q29 19.8 30 20.5" stroke="#3D2F1F" stroke-width="1.0" fill="none" stroke-linecap="round"/>
          <circle cx="15.5" cy="28" r="1.5" fill="#3D2F1F"/>
          <circle cx="32.5" cy="28" r="1.5" fill="#3D2F1F"/>
          <path d="M24 25 Q18 28 19.5 32 Q24 34.2 28.5 32 Q30 28 24 25 Z" fill="#FCD34D"/>
          <path d="M19.5 32 Q24 34.2 28.5 32" stroke="#3D2F1F" stroke-width="1.0" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">ぴよツールズ</span>
        <span class="brand-sub">サクッと使えるWebツール</span>
      </div>
    </a>
    <span class="topbar-sep" aria-hidden="true">/</span>
    <span class="topbar-current">テキスト変換</span>
    <div class="topbar-spacer"></div>
    <button type="button" class="theme-toggle" aria-label="テーマ切替"></button>
  </div>
</header>

<div class="page-header">
  <h1>テキスト変換</h1>
  <p>大文字小文字、全角半角、ひらカタ、エンコードなど</p>
</div>

<main>

  <div class="layout-grid">
    <!-- 入力 -->
    <div class="block">
      <div class="block-header">
        <span class="block-header-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
        </span>
        <span class="block-header-title">入力</span>
        <button class="header-btn" onclick="clearInput()" aria-label="入力をクリア">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          クリア
        </button>
      </div>
      <textarea id="input" class="text-area" placeholder="ここに変換したいテキストを入力してください"></textarea>
      <div class="stats-row">
        <span id="in-stats">0文字</span>
      </div>
    </div>

    <!-- 出力 -->
    <div class="block">
      <div class="block-header">
        <span class="block-header-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </span>
        <span class="block-header-title">出力</span>
        <button class="header-btn" id="copy-btn" onclick="copyOutput()" aria-label="結果をコピー">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span id="copy-label">コピー</span>
        </button>
      </div>
      <textarea id="output" class="text-area output" placeholder="変換結果がここに表示されます" readonly></textarea>
      <div class="stats-row">
        <span id="out-stats">0文字</span>
        <button class="header-btn" onclick="swapInputOutput()" aria-label="出力を入力に">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          出力を入力に
        </button>
      </div>
    </div>
  </div>

  <!-- 変換ボタン -->
  <div class="block" style="margin-top:16px">
    <div class="block-header">
      <span class="block-header-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </span>
      <span class="block-header-title">変換</span>
    </div>
    <div class="block-body">
      <div class="transform-section">
        <div class="transform-label">大文字 / 小文字</div>
        <div class="transform-row">
          <button class="tx-btn" onclick="apply('upper')">UPPERCASE</button>
          <button class="tx-btn" onclick="apply('lower')">lowercase</button>
          <button class="tx-btn" onclick="apply('title')">Title Case</button>
          <button class="tx-btn" onclick="apply('sentence')">Sentence case</button>
          <button class="tx-btn" onclick="apply('togglecase')">swap CASE</button>
        </div>
      </div>

      <div class="transform-section">
        <div class="transform-label">全角 / 半角</div>
        <div class="transform-row">
          <button class="tx-btn" onclick="apply('fullToHalf')">全角→半角</button>
          <button class="tx-btn" onclick="apply('halfToFull')">半角→全角</button>
        </div>
      </div>

      <div class="transform-section">
        <div class="transform-label">ひらがな / カタカナ</div>
        <div class="transform-row">
          <button class="tx-btn" onclick="apply('hiraToKata')">ひらがな→カタカナ</button>
          <button class="tx-btn" onclick="apply('kataToHira')">カタカナ→ひらがな</button>
        </div>
      </div>

      <div class="transform-section">
        <div class="transform-label">空白・改行</div>
        <div class="transform-row">
          <button class="tx-btn" onclick="apply('trim')">前後の空白を削除</button>
          <button class="tx-btn" onclick="apply('trimLines')">各行の前後を削除</button>
          <button class="tx-btn" onclick="apply('removeNewlines')">改行を削除</button>
          <button class="tx-btn" onclick="apply('collapseSpaces')">連続空白を1つに</button>
          <button class="tx-btn" onclick="apply('removeBlankLines')">空行を削除</button>
        </div>
      </div>

      <div class="transform-section">
        <div class="transform-label">並び替え</div>
        <div class="transform-row">
          <button class="tx-btn" onclick="apply('reverse')">文字を逆順</button>
          <button class="tx-btn" onclick="apply('reverseLines')">行を逆順</button>
          <button class="tx-btn" onclick="apply('sortLines')">行を昇順ソート</button>
          <button class="tx-btn" onclick="apply('sortLinesDesc')">行を降順ソート</button>
          <button class="tx-btn" onclick="apply('dedupeLines')">重複行を削除</button>
        </div>
      </div>

      <div class="transform-section">
        <div class="transform-label">エンコード / デコード</div>
        <div class="transform-row">
          <button class="tx-btn" onclick="apply('base64Encode')">Base64 エンコード</button>
          <button class="tx-btn" onclick="apply('base64Decode')">Base64 デコード</button>
          <button class="tx-btn" onclick="apply('urlEncode')">URL エンコード</button>
          <button class="tx-btn" onclick="apply('urlDecode')">URL デコード</button>
          <button class="tx-btn" onclick="apply('htmlEscape')">HTML エスケープ</button>
          <button class="tx-btn" onclick="apply('htmlUnescape')">HTML アンエスケープ</button>
        </div>
      </div>
    </div>
  </div>

</main>

<footer>ぴよツールズ — 社内専用</footer>

<script>
const inputEl  = document.getElementById('input');
const outputEl = document.getElementById('output');
const inStatsEl  = document.getElementById('in-stats');
const outStatsEl = document.getElementById('out-stats');
const copyLabel  = document.getElementById('copy-label');

const transforms = {
  upper:    t => t.toUpperCase(),
  lower:    t => t.toLowerCase(),
  title:    t => t.toLowerCase().replace(/(?:^|[\s\-/])\w/g, c => c.toUpperCase()),
  sentence: t => t.toLowerCase().replace(/(^|[.!?]\s+)([a-zあ-ん])/g, (_, p, c) => p + c.toUpperCase()),
  togglecase: t => [...t].map(c => c === c.toLowerCase() ? c.toUpperCase() : c.toLowerCase()).join(''),

  fullToHalf: t => t
    .replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/　/g, ' '),
  halfToFull: t => t
    .replace(/[\x21-\x7E]/g, c => String.fromCharCode(c.charCodeAt(0) + 0xFEE0))
    .replace(/ /g, '　'),

  hiraToKata: t => t.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60)),
  kataToHira: t => t.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)),

  trim:           t => t.trim(),
  trimLines:      t => t.split('\n').map(l => l.trim()).join('\n'),
  removeNewlines: t => t.replace(/\r?\n/g, ' ').replace(/[ \t]+/g, ' '),
  collapseSpaces: t => t.replace(/[ \t]+/g, ' '),
  removeBlankLines: t => t.split('\n').filter(l => l.trim().length > 0).join('\n'),

  reverse:       t => [...t].reverse().join(''),
  reverseLines:  t => t.split('\n').reverse().join('\n'),
  sortLines:     t => t.split('\n').sort((a, b) => a.localeCompare(b, 'ja')).join('\n'),
  sortLinesDesc: t => t.split('\n').sort((a, b) => b.localeCompare(a, 'ja')).join('\n'),
  dedupeLines:   t => Array.from(new Set(t.split('\n'))).join('\n'),

  base64Encode: t => { try { return btoa(unescape(encodeURIComponent(t))); } catch (e) { return 'Error: ' + e.message; } },
  base64Decode: t => { try { return decodeURIComponent(escape(atob(t.replace(/\s/g, '')))); } catch (e) { return 'Error: Base64として無効'; } },
  urlEncode:    t => { try { return encodeURIComponent(t); } catch (e) { return 'Error: ' + e.message; } },
  urlDecode:    t => { try { return decodeURIComponent(t); } catch (e) { return 'Error: URLエンコードとして無効'; } },
  htmlEscape:   t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'),
  htmlUnescape: t => t.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&'),
};

function apply(name) {
  const fn = transforms[name];
  if (!fn) return;
  outputEl.value = fn(inputEl.value);
  updateStats();
}

function updateStats() {
  inStatsEl.textContent  = `${[...inputEl.value].length}文字`;
  outStatsEl.textContent = `${[...outputEl.value].length}文字`;
}

function copyOutput() {
  if (!outputEl.value) return;
  navigator.clipboard.writeText(outputEl.value).then(() => {
    copyLabel.textContent = '✓ コピーしました';
    setTimeout(() => { copyLabel.textContent = 'コピー'; }, 1500);
  }).catch(() => alert('コピーに失敗しました'));
}

function clearInput() {
  inputEl.value = '';
  outputEl.value = '';
  updateStats();
  inputEl.focus();
}

function swapInputOutput() {
  if (!outputEl.value) return;
  inputEl.value = outputEl.value;
  outputEl.value = '';
  updateStats();
  inputEl.focus();
}

inputEl.addEventListener('input', updateStats);
updateStats();
</script>
</body>
</html>
