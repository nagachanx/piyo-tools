<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード生成 — ぴよツールズ</title>
  <link rel="icon" href="piyo-favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:            #F5F5F4;
      --surface:       #FFFFFF;
      --border:        #E7E5E4;
      --border-strong: #D6D3D1;
      --text-1:        #1C1917;
      --text-2:        #44403C;
      --text-3:        #78716C;
      --text-4:        #A8A29E;
      --icon-bg:       #F3F4F6;
      --primary:       #43A86A;
      --primary-dk:    #2D8D57;
      --primary-lt:    #C5E5D1;
      --primary-bg:    #EEF7F1;
      --radius-card:   14px;
      --radius:        8px;
      --shadow-sm:     0 1px 2px rgba(15,23,42,0.04);
      --ring:          0 0 0 3px rgba(61,167,107,0.20);
      --transition:    150ms ease-out;
      --weak:          #EF4444;
      --medium:        #F59E0B;
      --strong:        #10B981;
      --max:           #43A86A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text-1);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ─ Topbar ─────────────────────────── */
    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .topbar-inner { max-width: 1200px; width: 100%; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; }
    .brand-logo { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .brand-logo svg { width: 60px; height: 60px; }
    .brand-text { display: flex; flex-direction: column; line-height: 1.15; gap: 4px; }
    .brand-name { font-size: 26px; font-weight: 800; color: var(--text-1); letter-spacing: -0.02em; }
    .brand-sub { font-size: 13px; color: var(--text-3); font-weight: 400; }
    .topbar-sep { color: var(--text-4); font-size: 18px; user-select: none; margin-left: 6px; }
    .topbar-current { font-size: 15px; font-weight: 600; color: var(--text-2); }
    .topbar-spacer { flex: 1; }
    .icon-btn { width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text-3); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color var(--transition), border-color var(--transition); }
    .icon-btn svg { width: 16px; height: 16px; }
    .icon-btn:hover { color: var(--text-1); border-color: var(--border-strong); }
    .icon-btn:focus-visible { outline: none; box-shadow: var(--ring); border-color: var(--primary); }

    /* ─ Page header ───────────────────── */
    .page-header { max-width: 1200px; margin: 0 auto; padding: 32px 24px 16px; }
    .page-header h1 { font-size: 28px; font-weight: 700; color: var(--text-1); letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 6px; }
    .page-header p { font-size: 14px; color: var(--text-3); }

    /* ─ Main ──────────────────────────── */
    main { max-width: 880px; margin: 0 auto; padding: 8px 24px 80px; }

    /* ─ Block ─────────────────────────── */
    .block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      margin-bottom: 20px;
      overflow: hidden;
    }
    .block-header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .block-header-icon { width: 18px; height: 18px; color: var(--text-3); display: inline-flex; align-items: center; justify-content: center; }
    .block-header-icon svg { width: 100%; height: 100%; }
    .block-header-title { font-size: 14px; font-weight: 600; color: var(--text-1); }
    .block-body { padding: 20px; }

    /* ─ Length slider ─────────────────── */
    .section { margin-bottom: 22px; }
    .section:last-child { margin-bottom: 0; }
    .section-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .length-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
    }
    .slider-row { display: flex; align-items: center; gap: 14px; }
    .length-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: var(--icon-bg);
      border-radius: 3px;
      outline: none;
    }
    .length-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(15,23,42,0.15);
      transition: transform var(--transition);
    }
    .length-slider::-webkit-slider-thumb:hover { transform: scale(1.15); }
    .length-slider::-moz-range-thumb {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      border: none;
      box-shadow: 0 1px 3px rgba(15,23,42,0.15);
    }
    .length-slider:focus-visible { box-shadow: var(--ring); }
    .length-input {
      width: 60px;
      padding: 6px 8px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      text-align: center;
      color: var(--text-1);
      font-variant-numeric: tabular-nums;
    }
    .length-input:focus-visible {
      outline: none;
      border-color: var(--primary);
      box-shadow: var(--ring);
    }

    /* ─ Checkboxes (toggle list) ──────── */
    .toggle-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
    }
    .toggle-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all var(--transition);
      background: var(--surface);
      user-select: none;
    }
    .toggle-item:hover { border-color: var(--border-strong); background: #FAFAF9; }
    .toggle-item.checked {
      border-color: var(--primary);
      background: var(--primary-bg);
    }
    .toggle-item input { display: none; }
    .toggle-check {
      width: 18px; height: 18px;
      border-radius: 4px;
      border: 1.5px solid var(--border-strong);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }
    .toggle-item.checked .toggle-check {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    .toggle-check svg { width: 12px; height: 12px; opacity: 0; }
    .toggle-item.checked .toggle-check svg { opacity: 1; }
    .toggle-label {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-1);
    }
    .toggle-hint {
      font-size: 11px;
      color: var(--text-4);
      font-family: 'SF Mono', 'Menlo', monospace;
      margin-top: 2px;
    }

    /* ─ Generate button ───────────────── */
    .generate-btn {
      width: 100%;
      height: 52px;
      padding: 0 24px;
      background: var(--primary);
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      font-family: inherit;
      transition: all var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 1px 2px rgba(15,23,42,0.05);
    }
    .generate-btn svg { width: 16px; height: 16px; }
    .generate-btn:hover { background: var(--primary-dk); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(61,167,107,0.28); }
    .generate-btn:focus-visible { outline: none; box-shadow: var(--ring), 0 4px 12px rgba(61,167,107,0.28); }
    .generate-btn:active { transform: translateY(0); }
    .generate-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    /* ─ Results ───────────────────────── */
    .pw-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }
    .pw-row:last-child { border-bottom: none; }
    .pw-num {
      width: 24px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-4);
      flex-shrink: 0;
    }
    .pw-text {
      flex: 1;
      font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-1);
      letter-spacing: 0.02em;
      word-break: break-all;
      user-select: all;
    }
    .pw-strength {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      min-width: 80px;
    }
    .pw-strength-bar {
      width: 60px;
      height: 5px;
      background: var(--icon-bg);
      border-radius: 3px;
      overflow: hidden;
    }
    .pw-strength-fill {
      height: 100%;
      transition: width var(--transition), background var(--transition);
      border-radius: 3px;
    }
    .pw-strength-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .pw-copy {
      flex-shrink: 0;
      width: 36px; height: 36px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text-3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }
    .pw-copy svg { width: 14px; height: 14px; }
    .pw-copy:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-bg); }
    .pw-copy:focus-visible { outline: none; box-shadow: var(--ring); border-color: var(--primary); }
    .pw-copy.copied { border-color: var(--strong); color: var(--strong); background: #ECFDF5; }

    .pw-empty {
      padding: 36px 20px;
      text-align: center;
      color: var(--text-4);
      font-size: 13px;
    }

    /* ─ Footer ────────────────────────── */
    footer { max-width: 1200px; margin: 0 auto; padding: 24px; color: var(--text-4); font-size: 12px; text-align: center; }

    @media (max-width: 720px) {
      .topbar-inner { padding: 10px 16px; gap: 8px; }
      .brand-sub { display: none; }
      .page-header { padding: 24px 20px 8px; }
      .page-header h1 { font-size: 22px; }
      main { padding: 8px 16px 60px; }
      .pw-row { padding: 12px 14px; gap: 10px; }
      .pw-strength { min-width: 60px; }
      .pw-strength-bar { width: 50px; }
      .pw-text { font-size: 13px; }
    }
  </style>
</head>
<body>

<!-- Topbar -->
<header class="topbar" role="banner">
  <div class="topbar-inner">
    <a href="index.html" class="brand" aria-label="ぴよツールズ ホーム">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 6 C18 2 21 0.5 22 1 C23 3 22.5 6 22 9 Z" fill="#FCD34D" stroke="#3D2F1F" stroke-width="1.1" stroke-linejoin="round"/>

          <path d="M19.5 32.5 Q24 33.5 28.5 32.5" stroke="#3D2F1F" stroke-width="1.0" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">ぴよツールズ</span>
        <span class="brand-sub">サクッと使えるWebツール</span>
      </div>
    </a>
    <span class="topbar-sep" aria-hidden="true">/</span>

    <div class="topbar-spacer"></div>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </button>
  </div>
</header>

<!-- Page Header -->
<div class="page-header">
  <h1>パスワード生成</h1>
  <p>強度の高いパスワードを一括生成（暗号学的に安全な乱数を使用）</p>
</div>

<main>

  <!-- 設定 -->
  <div class="block">
    <div class="block-header">
      <span class="block-header-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </span>
      <span class="block-header-title">設定</span>
    </div>
    <div class="block-body">

      <div class="section">
        <div class="section-label">
          <span>文字数</span>
          <span class="length-value" id="length-display">16</span>
        </div>
        <div class="slider-row">
          <input type="range" id="length-slider" class="length-slider" min="6" max="64" value="16" aria-label="パスワードの文字数">
          <input type="number" id="length-input" class="length-input" min="6" max="64" value="16" aria-label="文字数の数値入力">
        </div>
      </div>

      <div class="section">
        <div class="section-label"><span>含める文字種</span></div>
        <div class="toggle-list">
          <label class="toggle-item checked" data-type="upper">
            <input type="checkbox" checked>
            <span class="toggle-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
            <span>
              <div class="toggle-label">大文字</div>
              <div class="toggle-hint">A B C ... Z</div>
            </span>
          </label>
          <label class="toggle-item checked" data-type="lower">
            <input type="checkbox" checked>
            <span class="toggle-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
            <span>
              <div class="toggle-label">小文字</div>
              <div class="toggle-hint">a b c ... z</div>
            </span>
          </label>
          <label class="toggle-item checked" data-type="number">
            <input type="checkbox" checked>
            <span class="toggle-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
            <span>
              <div class="toggle-label">数字</div>
              <div class="toggle-hint">0 1 2 ... 9</div>
            </span>
          </label>
          <label class="toggle-item" data-type="symbol">
            <input type="checkbox">
            <span class="toggle-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
            <span>
              <div class="toggle-label">記号</div>
              <div class="toggle-hint">! @ # $ % ...</div>
            </span>
          </label>
        </div>
      </div>

      <div class="section">
        <div class="section-label"><span>オプション</span></div>
        <div class="toggle-list">
          <label class="toggle-item checked" data-type="exclude-similar">
            <input type="checkbox" checked>
            <span class="toggle-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
            <span>
              <div class="toggle-label">紛らわしい文字を除外</div>
              <div class="toggle-hint">0 O 1 l I | ` '</div>
            </span>
          </label>
        </div>
      </div>

      <button class="generate-btn" id="generate-btn" onclick="generate()" aria-label="パスワードを5個生成">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        パスワードを5個生成
      </button>

    </div>
  </div>

  <!-- 結果 -->
  <div class="block">
    <div class="block-header">
      <span class="block-header-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </span>
      <span class="block-header-title">生成結果</span>
    </div>
    <div id="pw-list">
      <div class="pw-empty">「生成」ボタンを押すとここに5個のパスワードが表示されます</div>
    </div>
  </div>

</main>

<footer>ぴよツールズ — 社内専用</footer>

<script>
// ───────────────────── CHARACTER POOLS
const POOLS = {
  upper:  'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  lower:  'abcdefghijklmnopqrstuvwxyz',
  number: '0123456789',
  symbol: '!@#$%^&*()_+-=[]{};:,.<>?/~'
};
const SIMILAR = /[0O1lI|`']/g;

// ───────────────────── STATE
const state = {
  length: 16,
  upper: true,
  lower: true,
  number: true,
  symbol: false,
  excludeSimilar: true
};

// ───────────────────── DOM
const lengthSlider  = document.getElementById('length-slider');
const lengthInput   = document.getElementById('length-input');
const lengthDisplay = document.getElementById('length-display');
const genBtn        = document.getElementById('generate-btn');
const listEl        = document.getElementById('pw-list');

// ───────────────────── LENGTH BIND
function setLength(v) {
  v = Math.max(6, Math.min(64, parseInt(v, 10) || 16));
  state.length = v;
  lengthSlider.value = v;
  lengthInput.value = v;
  lengthDisplay.textContent = v;
}
lengthSlider.addEventListener('input', e => setLength(e.target.value));
lengthInput.addEventListener('input', e => setLength(e.target.value));
lengthInput.addEventListener('blur', () => setLength(lengthInput.value));

// ───────────────────── TOGGLE ITEMS
document.querySelectorAll('.toggle-item').forEach(item => {
  const cb = item.querySelector('input');
  item.addEventListener('click', e => {
    e.preventDefault();
    cb.checked = !cb.checked;
    item.classList.toggle('checked', cb.checked);
    const type = item.dataset.type;
    if (type === 'exclude-similar') state.excludeSimilar = cb.checked;
    else state[type] = cb.checked;
    updateGenButton();
  });
});

function updateGenButton() {
  const hasType = state.upper || state.lower || state.number || state.symbol;
  genBtn.disabled = !hasType;
}

// ───────────────────── CRYPTO RANDOM
function randInt(max) {
  // bias-resistant random integer in [0, max)
  const limit = Math.floor(0xFFFFFFFF / max) * max;
  const buf = new Uint32Array(1);
  let r;
  do { crypto.getRandomValues(buf); r = buf[0]; } while (r >= limit);
  return r % max;
}
function pick(str) { return str[randInt(str.length)]; }

// ───────────────────── PASSWORD GENERATION
function buildPool() {
  const sets = [];
  if (state.upper)  sets.push(POOLS.upper);
  if (state.lower)  sets.push(POOLS.lower);
  if (state.number) sets.push(POOLS.number);
  if (state.symbol) sets.push(POOLS.symbol);

  if (state.excludeSimilar) {
    return sets.map(s => s.replace(SIMILAR, ''));
  }
  return sets;
}

function generatePassword() {
  const sets = buildPool();
  if (sets.length === 0) return '';
  const all = sets.join('');
  const len = state.length;

  // 各文字種から最低1文字を確保
  const chars = sets.map(s => pick(s));
  while (chars.length < len) chars.push(pick(all));

  // Fisher-Yates シャッフル
  for (let i = chars.length - 1; i > 0; i--) {
    const j = randInt(i + 1);
    [chars[i], chars[j]] = [chars[j], chars[i]];
  }
  return chars.slice(0, len).join('');
}

// ───────────────────── STRENGTH
function calcStrength(pw) {
  if (!pw) return { label: '-', percent: 0, color: 'var(--text-4)' };
  let poolSize = 0;
  if (state.upper)  poolSize += state.excludeSimilar ? 24 : 26;
  if (state.lower)  poolSize += state.excludeSimilar ? 25 : 26;
  if (state.number) poolSize += state.excludeSimilar ? 8  : 10;
  if (state.symbol) poolSize += 25;
  if (poolSize === 0) return { label: '-', percent: 0, color: 'var(--text-4)' };

  const entropy = pw.length * Math.log2(poolSize);
  let label, color;
  if (entropy < 50)      { label = '弱';   color = 'var(--weak)'; }
  else if (entropy < 70) { label = '中';   color = 'var(--medium)'; }
  else if (entropy < 100){ label = '強';   color = 'var(--strong)'; }
  else                   { label = '最強'; color = 'var(--max)'; }

  return { label, percent: Math.min(100, (entropy / 130) * 100), color };
}

// ───────────────────── RENDER
function generate() {
  const pws = Array.from({ length: 5 }, () => generatePassword());
  if (pws.some(p => !p)) {
    listEl.innerHTML = '<div class="pw-empty">少なくとも1つの文字種を選択してください</div>';
    return;
  }

  listEl.innerHTML = pws.map((pw, i) => {
    const s = calcStrength(pw);
    const escaped = pw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<div class="pw-row">
      <span class="pw-num">#${i + 1}</span>
      <span class="pw-text">${escaped}</span>
      <span class="pw-strength">
        <span class="pw-strength-bar"><span class="pw-strength-fill" style="width:${s.percent}%;background:${s.color}"></span></span>
        <span class="pw-strength-label" style="color:${s.color}">${s.label}</span>
      </span>
      <button class="pw-copy" onclick="copyPw(this, ${i})" aria-label="パスワード${i+1}をコピー">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
    </div>`;
  }).join('');

  window._pws = pws;
}

async function copyPw(btn, idx) {
  const pw = window._pws?.[idx];
  if (!pw) return;
  try {
    await navigator.clipboard.writeText(pw);
    btn.classList.add('copied');
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    }, 1200);
  } catch (e) {
    alert('コピーに失敗しました');
  }
}

// 初期生成
updateGenButton();
generate();
</script>
