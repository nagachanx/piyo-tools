<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画像圧縮 — ぴよツールズ</title>
  <link rel="icon" href="piyo-favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="piyo-theme.css">
  <script src="piyo-theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:            #F5F5F4;
      --surface:       #FFFFFF;
      --border:        #E7E5E4;
      --border-strong: #D6D3D1;
      --text-1:        #1C1917;
      --text-2:        #44403C;
      --text-3:        #78716C;
      --text-4:        #A8A29E;
      --icon-bg:       #F3F4F6;
      --primary:       #43A86A;
      --primary-dk:    #2D8D57;
      --primary-lt:    #C5E5D1;
      --primary-bg:    #EEF7F1;
      --green:         #10B981;
      --green-lt:      #ECFDF5;
      --orange:        #F59E0B;
      --orange-lt:     #FFFBEB;
      --danger:        #EF4444;
      --radius-card:   14px;
      --radius:        8px;
      --shadow-sm:     0 1px 2px rgba(15,23,42,0.04);
      --ring:          0 0 0 3px rgba(61,167,107,0.20);
      --transition:    150ms ease-out;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text-1);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ─ Topbar ─────────────────────────── */
    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .topbar-inner { max-width: 1200px; width: 100%; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; }
    .brand-logo { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .brand-logo svg { width: 60px; height: 60px; }
    .brand-text { display: flex; flex-direction: column; line-height: 1.15; gap: 4px; }
    .brand-name { font-size: 26px; font-weight: 800; color: var(--text-1); letter-spacing: -0.02em; }
    .brand-sub { font-size: 13px; color: var(--text-3); font-weight: 400; }
    .topbar-sep { color: var(--text-4); font-size: 18px; user-select: none; margin-left: 6px; }
    .topbar-current { font-size: 15px; font-weight: 600; color: var(--text-2); }
    .topbar-spacer { flex: 1; }
    .icon-btn { width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text-3); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color var(--transition), border-color var(--transition); }
    .icon-btn svg { width: 16px; height: 16px; }
    .icon-btn:hover { color: var(--text-1); border-color: var(--border-strong); }
    .icon-btn:focus-visible { outline: none; box-shadow: var(--ring); border-color: var(--primary); }

    /* ─ Page header ───────────────────── */
    .page-header { max-width: 1200px; margin: 0 auto; padding: 32px 24px 16px; }
    .page-header h1 { font-size: 28px; font-weight: 700; color: var(--text-1); letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 6px; }
    .page-header p { font-size: 14px; color: var(--text-3); }

    /* ─ Main ──────────────────────────── */
    main { max-width: 1100px; margin: 0 auto; padding: 8px 24px 80px; }

    /* ─ Drop zone ─────────────────────── */
    .drop-zone {
      display: block;
      width: 100%;
      background: var(--surface);
      border: 2px dashed var(--border-strong);
      border-radius: var(--radius-card);
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition);
      margin-bottom: 20px;
    }
    .drop-zone:focus-visible {
      outline: none;
      border-color: var(--primary);
      box-shadow: var(--ring);
    }
    .drop-zone:hover { border-color: var(--primary); background: var(--primary-bg); }
    .drop-zone.dragover {
      border-color: var(--primary);
      background: var(--primary-bg);
      transform: scale(1.005);
    }
    .drop-icon {
      width: 56px; height: 56px;
      margin: 0 auto 14px;
      border-radius: 14px;
      background: var(--icon-bg);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-3);
    }
    .drop-zone:hover .drop-icon, .drop-zone.dragover .drop-icon { background: var(--primary-lt); color: var(--primary); }
    .drop-icon svg { width: 28px; height: 28px; }
    .drop-title { font-size: 16px; font-weight: 600; color: var(--text-1); margin-bottom: 4px; }
    .drop-sub { font-size: 13px; color: var(--text-3); }

    /* ─ Block ─────────────────────────── */
    .block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      margin-bottom: 20px;
      overflow: hidden;
    }
    .block-header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .block-header-icon { width: 18px; height: 18px; color: var(--text-3); display: inline-flex; align-items: center; justify-content: center; }
    .block-header-icon svg { width: 100%; height: 100%; }
    .block-header-title { font-size: 14px; font-weight: 600; color: var(--text-1); }
    .block-header-count { font-size: 12px; color: var(--text-4); font-weight: 500; margin-left: 4px; }
    .block-body { padding: 20px; }

    /* ─ Settings ──────────────────────── */
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .setting-item { }
    .setting-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .setting-value {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
      text-transform: none;
      letter-spacing: 0;
    }
    .seg-group {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .seg-btn {
      padding: 8px 14px;
      min-height: 36px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text-2);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all var(--transition);
    }
    .seg-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-bg); }
    .seg-btn.active { border-color: var(--primary); background: var(--primary); color: white; }
    .seg-btn:focus-visible { outline: none; box-shadow: var(--ring); }
    .quality-slider {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: var(--icon-bg);
      border-radius: 3px;
      outline: none;
    }
    .quality-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(15,23,42,0.15);
    }
    .quality-slider::-moz-range-thumb {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--primary);
      border: none;
      cursor: pointer;
    }
    .num-input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      font-size: 14px;
      font-family: inherit;
      color: var(--text-1);
      background: var(--surface);
    }
    .num-input:focus-visible { outline: none; border-color: var(--primary); box-shadow: var(--ring); }

    /* ─ File list ─────────────────────── */
    .file-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }
    .file-row:last-child { border-bottom: none; }
    .file-thumb {
      width: 56px; height: 56px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--icon-bg);
      flex-shrink: 0;
    }
    .file-info {
      flex: 1;
      min-width: 0;
    }
    .file-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .file-meta {
      font-size: 11px;
      color: var(--text-3);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .size-old { color: var(--text-3); }
    .size-arrow { color: var(--text-4); }
    .size-new { color: var(--text-1); font-weight: 600; }
    .reduction {
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
    }
    .reduction.good { background: var(--green-lt); color: #065F46; }
    .reduction.bad  { background: var(--orange-lt); color: #92400E; }
    .file-status {
      font-size: 11px;
      color: var(--text-4);
    }
    .file-status.error { color: var(--danger); }
    .file-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .row-btn {
      width: 36px; height: 36px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text-3);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--transition);
    }
    .row-btn svg { width: 14px; height: 14px; }
    .row-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: var(--primary-bg); }
    .row-btn.remove:hover { border-color: var(--danger); color: var(--danger); background: #FEF2F2; }
    .row-btn:focus-visible { outline: none; box-shadow: var(--ring); border-color: var(--primary); }
    .row-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .file-empty {
      padding: 32px 16px;
      text-align: center;
      color: var(--text-4);
      font-size: 13px;
    }

    /* ─ Actions ───────────────────────── */
    .actions-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 14px 20px;
      background: #FAFAF9;
      border-top: 1px solid var(--border);
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 16px;
      min-height: 40px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all var(--transition);
      border: 1px solid transparent;
    }
    .action-btn svg { width: 14px; height: 14px; }
    .action-btn.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .action-btn.primary:hover:not(:disabled) { background: var(--primary-dk); border-color: var(--primary-dk); }
    .action-btn.secondary {
      background: var(--surface);
      color: var(--text-2);
      border-color: var(--border-strong);
    }
    .action-btn.secondary:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: var(--primary-bg); }
    .action-btn:focus-visible { outline: none; box-shadow: var(--ring); }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .summary {
      margin-left: auto;
      font-size: 12px;
      color: var(--text-3);
      align-self: center;
    }

    /* ─ Footer ────────────────────────── */
    footer { max-width: 1200px; margin: 0 auto; padding: 24px; color: var(--text-4); font-size: 12px; text-align: center; }

    @media (max-width: 720px) {
      .topbar-inner { padding: 10px 16px; gap: 8px; }
      .brand-sub { display: none; }
      .page-header { padding: 24px 20px 8px; }
      .page-header h1 { font-size: 22px; }
      main { padding: 8px 16px 60px; }
      .drop-zone { padding: 32px 16px; }
      .file-row { padding: 12px 14px; gap: 10px; }
      .file-thumb { width: 44px; height: 44px; }
      .actions-bar { padding: 12px; }
      .summary { width: 100%; order: 99; }
    }
  </style>
</head>
<body>

<!-- Page Header -->
<div class="page-header">

</div>

<main>

  <!-- Drop Zone -->
  <label class="drop-zone" id="drop-zone" for="file-input" tabindex="0">
    <div class="drop-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>

  <!-- Settings -->
  <div class="block">
    <div class="block-header">
      <span class="block-header-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

            <span>品質</span>
            <span class="setting-value" id="quality-display">80%</span>
          </div>
          <input type="range" id="quality-slider" class="quality-slider" min="10" max="100" value="80" aria-label="品質">
        </div>
        <div class="setting-item">
          <div class="setting-label"><span>最大幅 (px)</span></div>
          <input type="number" id="max-width" class="num-input" placeholder="制限なし" min="100" max="8000" aria-label="最大幅">
        </div>
      </div>
    </div>

  <!-- File List -->
  <div class="block">
    <div class="block-header">
      <span class="block-header-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </span>

      <span class="block-header-count" id="file-count"></span>
    </div>
    <div id="file-list">
      <div class="file-empty">画像をドロップするとここに一覧が表示されます</div>
    </div>
    <div class="actions-bar" id="actions-bar" style="display:none">
      <button class="action-btn primary" id="dl-zip-btn" onclick="downloadZip()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        すべてZIPでダウンロード
      </button>
      <button class="action-btn secondary" onclick="clearAll()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        クリア
      </button>
      <span class="summary" id="summary"></span>
    </div>
  </div>

</main>

<footer>ぴよツールズ — 社内専用 ・ <a href="request.html" style="color:inherit;text-decoration:underline;opacity:0.85;">リクエスト</a></footer>

<!-- JSZip -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
// ───────────────────── STATE
const state = {
  format: 'auto',
  quality: 0.8,
  maxWidth: null,
  files: []   // { id, file, name, originalSize, originalW, originalH, thumbUrl, blob?, size?, width?, height?, status }
};
let nextId = 1;

// ───────────────────── DOM
const dropZone   = document.getElementById('drop-zone');
const fileInput  = document.getElementById('file-input');
const fileListEl = document.getElementById('file-list');
const fileCountEl = document.getElementById('file-count');
const actionsBar = document.getElementById('actions-bar');
const summaryEl  = document.getElementById('summary');
const dlZipBtn   = document.getElementById('dl-zip-btn');
const qualitySlider = document.getElementById('quality-slider');
const qualityDisplay = document.getElementById('quality-display');
const maxWidthInput  = document.getElementById('max-width');

// ───────────────────── UTILS
function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  return (b / (1024 * 1024)).toFixed(2) + ' MB';
}
function getOutputMime(file) {
  if (state.format === 'auto') {
    const type = file.type;
    if (type === 'image/jpeg' || type === 'image/png' || type === 'image/webp') return type;
    return 'image/jpeg';   // GIFやBMPはJPGに変換
  }
  return state.format;
}
function getOutputName(originalName, mime) {
  const base = originalName.replace(/\.[^.]+$/, '');
  const ext  = mime === 'image/jpeg' ? 'jpg' : mime === 'image/webp' ? 'webp' : 'png';
  return `${base}-compressed.${ext}`;
}

// ───────────────────── COMPRESSION
async function compressFile(item) {
  item.status = 'compressing';
  renderList();
  try {
    const bitmap = await createImageBitmap(item.file);
    item.originalW = bitmap.width;
    item.originalH = bitmap.height;

    let targetW = bitmap.width;
    let targetH = bitmap.height;
    if (state.maxWidth && targetW > state.maxWidth) {
      targetH = Math.round(targetH * (state.maxWidth / targetW));
      targetW = state.maxWidth;
    }

    const canvas = document.createElement('canvas');
    canvas.width  = targetW;
    canvas.height = targetH;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(bitmap, 0, 0, targetW, targetH);
    bitmap.close?.();

    const mime = getOutputMime(item.file);
    const quality = mime === 'image/png' ? undefined : state.quality;
    const blob = await new Promise((resolve, reject) => {
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), mime, quality);
    });

    item.blob   = blob;
    item.mime   = mime;
    item.size   = blob.size;
    item.width  = targetW;
    item.height = targetH;
    item.status = 'done';
  } catch (e) {
    console.error('[compress]', item.name, e);
    item.status = 'error';
    item.errorMsg = e.message || '圧縮失敗';
  }
  renderList();
}

async function compressAll() {
  for (const item of state.files) {
    await compressFile(item);
  }
}

let recompressTimer = null;
function scheduleRecompress() {
  if (recompressTimer) clearTimeout(recompressTimer);
  recompressTimer = setTimeout(compressAll, 200);
}

// ───────────────────── FILE INPUT / DROP
async function addFiles(fileList) {
  const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
  for (const f of files) {
    const id = nextId++;
    const item = {
      id, file: f, name: f.name, originalSize: f.size,
      thumbUrl: URL.createObjectURL(f),
      status: 'pending'
    };
    state.files.push(item);
  }
  renderList();
  for (const item of state.files.filter(i => i.status === 'pending')) {
    await compressFile(item);
  }
}

fileInput.addEventListener('change', e => {
  addFiles(e.target.files);
  fileInput.value = '';
});

['dragenter', 'dragover'].forEach(ev => {
  dropZone.addEventListener(ev, e => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });
});
['dragleave', 'drop'].forEach(ev => {
  dropZone.addEventListener(ev, e => {
    e.preventDefault();
    if (ev === 'dragleave' && e.target !== dropZone) return;
    dropZone.classList.remove('dragover');
  });
});
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  if (e.dataTransfer.files.length > 0) addFiles(e.dataTransfer.files);
});
dropZone.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
});

// ───────────────────── SETTINGS BINDINGS
document.getElementById('format-group').addEventListener('click', e => {
  const btn = e.target.closest('.seg-btn');
  if (!btn) return;
  document.querySelectorAll('#format-group .seg-btn').forEach(b => {
    b.classList.toggle('active', b === btn);
    b.setAttribute('aria-checked', b === btn);
  });
  state.format = btn.dataset.format;
  scheduleRecompress();
});

qualitySlider.addEventListener('input', e => {
  const v = parseInt(e.target.value, 10);
  state.quality = v / 100;
  qualityDisplay.textContent = v + '%';
  scheduleRecompress();
});

maxWidthInput.addEventListener('input', e => {
  const v = parseInt(e.target.value, 10);
  state.maxWidth = (v && v >= 100) ? v : null;
  scheduleRecompress();
});

// ───────────────────── RENDER
function renderList() {
  const n = state.files.length;
  fileCountEl.textContent = n > 0 ? `(${n})` : '';
  actionsBar.style.display = n > 0 ? '' : 'none';

  if (n === 0) {
    fileListEl.innerHTML = '<div class="file-empty">画像をドロップするとここに一覧が表示されます</div>';
    summaryEl.textContent = '';
    return;
  }

  fileListEl.innerHTML = state.files.map(item => {
    let metaRight = '';
    let downloadDisabled = '';
    let statusLabel = '';
    if (item.status === 'compressing') {
      statusLabel = '<span class="file-status">圧縮中…</span>';
      downloadDisabled = 'disabled';
    } else if (item.status === 'error') {
      statusLabel = `<span class="file-status error">エラー: ${item.errorMsg || ''}</span>`;
      downloadDisabled = 'disabled';
    } else if (item.status === 'done') {
      const ratio = (item.size / item.originalSize);
      const pct = ((1 - ratio) * 100).toFixed(1);
      const cls = ratio < 1 ? 'good' : 'bad';
      const sign = ratio < 1 ? '-' : '+';
      metaRight = `
        <span class="size-old">${formatBytes(item.originalSize)}</span>
        <span class="size-arrow">→</span>
        <span class="size-new">${formatBytes(item.size)}</span>
        <span class="reduction ${cls}">${sign}${Math.abs(pct)}%</span>
        <span class="file-status">${item.originalW}×${item.originalH} → ${item.width}×${item.height}</span>
      `;
    } else {
      statusLabel = '<span class="file-status">待機中…</span>';
      downloadDisabled = 'disabled';
    }
    return `<div class="file-row">
      <img class="file-thumb" src="${item.thumbUrl}" alt="" loading="lazy">
      <div class="file-info">
        <div class="file-name" title="${item.name}">${item.name}</div>
        <div class="file-meta">${metaRight || statusLabel}</div>
      </div>
      <div class="file-actions">
        <button class="row-btn" onclick="downloadOne(${item.id})" ${downloadDisabled} aria-label="ダウンロード">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button class="row-btn remove" onclick="removeOne(${item.id})" aria-label="削除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
    </div>`;
  }).join('');

  // サマリー
  const done = state.files.filter(i => i.status === 'done');
  if (done.length > 0) {
    const totalOld = done.reduce((s, i) => s + i.originalSize, 0);
    const totalNew = done.reduce((s, i) => s + i.size, 0);
    const reduction = ((1 - totalNew / totalOld) * 100).toFixed(1);
    summaryEl.textContent = `合計 ${formatBytes(totalOld)} → ${formatBytes(totalNew)} （${reduction > 0 ? '-' : '+'}${Math.abs(reduction)}%）`;
    dlZipBtn.disabled = false;
  } else {
    summaryEl.textContent = '圧縮中…';
    dlZipBtn.disabled = true;
  }
}

// ───────────────────── DOWNLOAD
function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function downloadOne(id) {
  const item = state.files.find(i => i.id === id);
  if (!item || !item.blob) return;
  triggerDownload(item.blob, getOutputName(item.name, item.mime));
}

function removeOne(id) {
  const item = state.files.find(i => i.id === id);
  if (item) URL.revokeObjectURL(item.thumbUrl);
  state.files = state.files.filter(i => i.id !== id);
  renderList();
}

function clearAll() {
  state.files.forEach(i => URL.revokeObjectURL(i.thumbUrl));
  state.files = [];
  renderList();
}

async function downloadZip() {
  const done = state.files.filter(i => i.status === 'done');
  if (done.length === 0) return;
  if (typeof JSZip === 'undefined') {
    alert('ZIPライブラリの読み込みに失敗しました。ページを再読み込みしてください。');
    return;
  }
  dlZipBtn.disabled = true;
  const label = dlZipBtn.querySelector('span') || dlZipBtn;
  const oldHTML = dlZipBtn.innerHTML;
  dlZipBtn.innerHTML = 'ZIP作成中…';
  try {
    const zip = new JSZip();
    done.forEach(item => zip.file(getOutputName(item.name, item.mime), item.blob));
    const blob = await zip.generateAsync({ type: 'blob' });
    const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    triggerDownload(blob, `images-compressed-${ts}.zip`);
  } catch (e) {
    alert('ZIP作成に失敗しました: ' + e.message);
  } finally {
    dlZipBtn.innerHTML = oldHTML;
    dlZipBtn.disabled = false;
  }
}

// 初期化
renderList();
</script>
</body>
